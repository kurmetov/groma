[workspace]
members = [
    "apps/groma-api",
    "apps/groma-cli",
    "crates/bim-core",
    "crates/bim-convert",
    "crates/bim-mesh",
    "crates/scene-pack",
    "crates/ifc-import",
    "crates/ifc-export",
    "crates/revit-catalog",
    "crates/rvt-container",
    "crates/rvt-import",
    "crates/rvt-model",
    "crates/rvt-schema",
]
resolver = "2"

[workspace.package]
version = "0.9.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-only"

[workspace.dependencies]
cfb = "0.14.0"
clap = { version = "4.5", features = ["derive"] }
flate2 = "1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tiny_http = "0.12"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

# The corpus runs to hundreds of megabytes a file and the record walk is the
# whole cost of a conversion, so the release build is tuned for it: one
# codegen unit and cross-crate inlining let the walk in `rvt-model` be inlined
# into the readers in `rvt-import` and `ifc-import`, which is where the hot
# loops actually live. `panic` is left unwinding so `cargo test --release`
# still catches assertions.
[profile.release]
lto = "fat"
codegen-units = 1
