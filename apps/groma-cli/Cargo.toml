[package]
name = "groma-cli"
description = "Command-line inspection tools for groma"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "groma"
path = "src/main.rs"

[dependencies]
bim-convert = { path = "../../crates/bim-convert" }
bim-core = { path = "../../crates/bim-core" }
bim-mesh = { path = "../../crates/bim-mesh" }
clap.workspace = true
ifc-export = { path = "../../crates/ifc-export" }
ifc-import = { path = "../../crates/ifc-import" }
revit-catalog = { path = "../../crates/revit-catalog" }
scene-pack = { path = "../../crates/scene-pack" }
rvt-container = { path = "../../crates/rvt-container" }
rvt-import = { path = "../../crates/rvt-import" }
rvt-model = { path = "../../crates/rvt-model" }
rvt-schema = { path = "../../crates/rvt-schema" }
mimalloc = "0.1.52"

[dev-dependencies]
cfb.workspace = true
flate2.workspace = true
serde_json.workspace = true
tempfile = "3"

[lints]
workspace = true
