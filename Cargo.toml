[workspace]
members = [
    "apps/rivet-api",
    "apps/rivet-cli",
    "crates/bim-core",
    "crates/ifc-export",
    "crates/revit-catalog",
    "crates/rvt-container",
    "crates/rvt-model",
    "crates/rvt-schema",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-only"

[workspace.dependencies]
cfb = "0.14.0"
clap = { version = "4.5", features = ["derive"] }
flate2 = "1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tiny_http = "0.12"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
